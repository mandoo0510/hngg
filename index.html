<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>희낙.GG · 희희낙락 킬내기 전적</title>
<meta property="og:title" content="희낙.GG">
<meta name="description" content="희낙.GG · 희희낙락 PUBG 킬내기 티어별 전적 · 승률 · KD 랭킹 · 경기 기록">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:image" content="logo.webp">
<meta name="theme-color" content="#05060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#05060c;--bg2:#090b14;--card:rgba(16,19,34,.82);--s1:#151a2c;--s2:#0c0f1c;--hov:#1c2340;--line:#1d2440;--line2:#2b3560;--txt:#e9edfb;--mut:#8a93b5;--dim:#58618a;--gold:#8fb0ff;--gold2:#c2d3ff;--vio:#a88bff;--red:#e5484d;--blue:#4d7cf0;--green:#4cc38a;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25)}
:root[data-theme="light"]{--bg:#f2f4fa;--bg2:#e9edf7;--card:#ffffff;--s1:#f4f6fc;--s2:#edf0f8;--hov:#e6ebf7;--line:#e0e5f1;--line2:#cfd6e8;--txt:#141a2e;--mut:#626b88;--dim:#98a0bb;--gold:#3d63e0;--gold2:#2b4cc0;--vio:#7a55e8;--sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 420px at 18% -120px,rgba(70,110,255,.22),transparent 70%),radial-gradient(700px 380px at 95% 0,rgba(150,100,255,.14),transparent 70%),radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 85% 25%,rgba(255,255,255,.4),transparent);z-index:0}
:root[data-theme="light"] body:before{background:radial-gradient(900px 420px at 18% -120px,rgba(70,110,255,.12),transparent 70%),radial-gradient(700px 380px at 95% 0,rgba(150,100,255,.08),transparent 70%)}
.card{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
button,input,select{font-family:inherit}
.wrap{position:relative;z-index:1;display:grid;grid-template-columns:210px minmax(0,1fr) 250px;gap:16px;padding:18px;max-width:1440px;margin:0 auto;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.hide{display:none!important}
/* side */
.side{position:sticky;top:18px;padding:16px;max-height:calc(100vh - 36px);overflow:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px;letter-spacing:.01em}
.blogo{width:34px;height:34px;border-radius:50%;box-shadow:0 0 14px rgba(90,140,255,.55)}
.sub{color:var(--mut);font-size:11px;margin:6px 0 14px 43px}
.stat{padding:12px;border-radius:11px;background:var(--s1);margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;color:var(--mut)}
.row b{color:var(--txt);font-size:14px;font-variant-numeric:tabular-nums}
.lbl{color:var(--mut);font-size:10.5px;margin:2px 0 7px;letter-spacing:.04em;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:700;padding:7px 0;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--s1);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tnav{display:grid;gap:4px}
.tnav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:#c9cbd1;text-decoration:none;font-size:12px;font-weight:700;border:1px solid transparent}
:root[data-theme="light"] .tnav a{color:#3a3d44}
.tnav a:hover{background:var(--hov);border-color:var(--line)}
.tnav a i{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:8px}
.tnav a span{color:var(--dim);font-weight:500;font-size:11px}
.btn{border:1px solid var(--line2);background:var(--s1);color:var(--txt);border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:12px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hov)}
.btn.wide{width:100%;margin-top:4px}
/* main */
.head{padding:22px 26px;margin-bottom:14px;position:relative;overflow:hidden;display:flex;align-items:center;gap:24px;background:linear-gradient(120deg,rgba(40,60,160,.35),rgba(16,19,34,.85) 45%,rgba(90,60,190,.25));border-color:var(--line2)}
:root[data-theme="light"] .head{background:linear-gradient(120deg,rgba(70,110,255,.12),#fff 45%,rgba(150,100,255,.10))}
.head:after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(110,150,255,.18),transparent 70%)}
.hlogo{flex:none;width:118px;height:118px;border-radius:50%;box-shadow:0 0 0 1px rgba(140,170,255,.25),0 0 40px rgba(70,120,255,.55),0 0 90px rgba(120,90,255,.25);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(140,170,255,.35),0 0 54px rgba(70,120,255,.75),0 0 110px rgba(120,90,255,.35)}}
.htxt{position:relative;z-index:1;min-width:0}
.han{font-size:12px;color:var(--gold2);letter-spacing:.25em;font-weight:700;margin-top:2px}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--mut);font-weight:700}
.head h1{margin:6px 0 4px;font-size:26px;font-weight:900;letter-spacing:-.01em;background:linear-gradient(90deg,#fff,#b9ccff 60%,#c9b6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .head h1{background:linear-gradient(90deg,#141a2e,#3d63e0);-webkit-background-clip:text;background-clip:text}
.head h1 em{font-style:normal;color:var(--gold);-webkit-text-fill-color:var(--gold);font-size:13px;font-weight:700;margin-left:10px;vertical-align:3px;padding:3px 9px;border:1px solid rgba(110,150,255,.35);border-radius:999px}
.head p{margin:10px 0 0;color:var(--mut);font-size:12px}
.tools{padding:10px;display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:10px 12px 10px 14px;color:var(--txt);font-size:12.5px;outline:none}
.tools input:focus{border-color:var(--line2)}
.vtabs{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.vtabs button{border:0;background:none;color:var(--mut);font-size:12px;font-weight:700;padding:7px 14px;border-radius:7px;cursor:pointer}
.vtabs button.on{background:var(--s1);color:var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.18)}
/* tier board */
.tier{margin-bottom:14px;overflow:hidden;scroll-margin-top:18px}
.th{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.th h2{margin:0;font-size:18px;font-weight:900;display:flex;align-items:center;gap:10px}
.th h2 small{font-size:11px;font-weight:700;color:var(--mut);padding:3px 8px;border-radius:6px;background:var(--s1);border:1px solid var(--line)}
.cnt{white-space:nowrap;font-size:11px;color:var(--mut);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.list{padding:12px 14px 6px}
.pl{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--s1);border:1px solid transparent;border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.pl:hover{border-color:var(--line2);background:var(--hov)}
.pl.no{opacity:.55}
.nm{min-width:0}
.nm b{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .rk{display:inline-block;margin-top:5px;font-size:10.5px;color:var(--mut)}
.nm .rk em{font-style:normal;color:var(--gold);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{width:22px;height:18px;border-radius:4px;font-size:9.5px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#fff;user-select:none;position:relative}
.chip.W{background:linear-gradient(180deg,#5b86ff,#3a63e0)}.chip.L{background:linear-gradient(180deg,#e0525a,#b8373f)}
.chip.e{background:transparent;border:1px dashed var(--line2)}
.chip:hover:after{content:attr(data-t);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#000;color:#fff;font-weight:500;font-size:11px;padding:5px 8px;border-radius:6px;z-index:5;pointer-events:none}
.nochip{color:var(--dim);font-size:11.5px}
.nums{display:flex;gap:6px}
.num{min-width:58px;padding:7px 9px;text-align:center;border-radius:8px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.num span{display:block;color:var(--mut);font-size:9.5px;font-weight:500;margin-bottom:2px}
.num.hl{color:var(--gold);border-color:rgba(110,150,255,.3)}
/* games */
.rules{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0}
.pill{cursor:pointer;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--s1);color:var(--mut)}
.pill.on{background:rgba(110,150,255,.1);border-color:rgba(110,150,255,.45);color:var(--gold)}
.gm{border-top:1px solid var(--line)}
.gm:first-child{border-top:0}
.gmh{display:grid;grid-template-columns:70px auto minmax(0,1fr) auto 14px;gap:12px;align-items:center;padding:13px 18px;cursor:pointer}
.gmh:hover{background:var(--s1)}
.gd b{display:block;font-size:14px;font-weight:900}
.gd span{font-size:11px;color:var(--mut)}
.rb{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--s1);border:1px solid var(--line);white-space:nowrap}
.rb.dk{color:#f08a9a;border-color:rgba(229,72,77,.35)}.rb.hell{color:#f29a5c;border-color:rgba(242,154,92,.35)}.rb.pt{color:#5fc3e4;border-color:rgba(95,195,228,.35)}.rb.yd{color:var(--gold);border-color:rgba(110,150,255,.35)}
.wn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9cbd1}
:root[data-theme="light"] .wn{color:#3a3d44}
.wn b{color:var(--gold)}
.gmeta{font-size:11.5px;color:var(--mut);white-space:nowrap}
.chev{color:var(--dim);font-size:10px;transition:transform .2s}
.gm.open .chev{transform:rotate(90deg)}
.gmb{display:none;padding:2px 18px 16px}
.gm.open .gmb{display:block}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.gp{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;background:var(--s1);border:1px solid var(--line);font-size:12px;cursor:pointer}
.gp.w{border-color:rgba(110,150,255,.4);background:rgba(110,150,255,.07)}
.gp b{margin-left:auto;font-variant-numeric:tabular-nums}
.more{display:block;margin:12px auto 16px}
/* rank rail */
.rank{position:sticky;top:18px;padding:16px}
.rank .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.rank h3{margin:4px 0 2px;font-size:15px;font-weight:900}
.rank small{color:var(--mut);font-size:10px}
.rseg{grid-template-columns:repeat(3,1fr);margin-bottom:6px}
.ri{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--s1);margin-top:6px;cursor:pointer;border:1px solid transparent}
.ri:hover{border-color:var(--line2)}
.ri .n{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--mut);font-weight:900;font-size:11px;border:1px solid var(--line)}
.ri:nth-child(-n+3) .n{color:var(--gold);border-color:rgba(110,150,255,.35);background:rgba(110,150,255,.08)}
.ri b{font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .s{color:var(--mut);font-size:10px}
.ri .p{text-align:right;font-weight:900;font-size:12.5px;font-variant-numeric:tabular-nums}
.ri .p span{display:block;color:var(--mut);font-size:9.5px;font-weight:500}
.rnote{color:var(--dim);font-size:10.5px;margin-top:10px;text-align:center}
.seg4{grid-template-columns:repeat(2,1fr)}
.mseg .mg{grid-column:1/-1;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.04em;padding:7px 4px 2px}
.seg button.on.rv{color:var(--gold)}
.rall{width:100%;margin-top:10px}
/* full ranking */
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px 0}
.rbar .sp{flex:1}
.rsel{background:var(--s2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:12px;outline:none}
.rt{width:100%;border-collapse:collapse;margin-top:10px}
.rt th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.rt th.l,.rt td.l{text-align:left}
.rt th.on{color:var(--gold)}
.rt th:hover{color:var(--txt)}
.rt td{padding:10px 12px;text-align:right;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.rt tr.rw{cursor:pointer}
.rt tr.rw:hover td{background:var(--s1)}
.rt tr:last-child td{border-bottom:0}
.rt .rn{width:44px;color:var(--mut);font-weight:900}
.rt tr.t3 .rn{color:var(--gold)}
.rt .nmc b{font-weight:700;margin-right:8px}
.rt td.on{color:var(--gold);font-weight:900}
.wbar{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.wbar i{display:inline-block;width:52px;height:5px;border-radius:9px;background:var(--s2);position:relative;overflow:hidden}
.wbar i b{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#5b86ff,#a88bff)}
.tscroll{overflow-x:auto}
/* admin */
.adm{display:none!important}
body.isadm .adm{display:inline-flex!important}
body.isadm .vtabs .adm{display:block!important}
body.isadm .noadm{display:none!important}
.abox .who{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
.abox .who b{font-weight:900}
.abox .who span{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid rgba(110,150,255,.4);color:var(--gold)}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.abtns .btn{padding:8px 6px;font-size:11.5px}
.fm{padding:18px 20px 20px}
.fm label{display:block;font-size:11.5px;color:var(--mut);margin:12px 0 6px;font-weight:700}
.fm input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13px;outline:none}
.fm input:focus{border-color:var(--gold)}
.fm .msg{min-height:18px;color:#ff8a8e;font-size:12px;margin-top:10px}
.fm .msg.ok{color:var(--green)}
.btn.pri{background:linear-gradient(180deg,#5b86ff,#3d63e0);border-color:#4a6fe8;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:#ff8a8e}
.fm .row2{display:flex;gap:8px;margin-top:16px}
.fm .row2 .btn{flex:1}
.alist{margin-top:6px}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;background:var(--s1);margin-top:6px;font-size:12.5px}
.arow b{flex:1}
.arow .btn{padding:5px 9px;font-size:11px}
/* team builder */
.tb{padding:14px 16px 16px}
.tb h3{margin:0 0 10px;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tb h3 small{font-size:11px;color:var(--mut);font-weight:500}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl .lb{font-size:11px;color:var(--mut);font-weight:700;margin-right:2px}
.ctl .seg{display:inline-grid;grid-auto-flow:column;grid-template-columns:none}
.ctl .seg button{padding:7px 12px}
.ctl input[type=number]{width:64px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;color:var(--txt);font-size:12px}
.pick{display:flex;flex-wrap:wrap;gap:5px;max-height:260px;overflow:auto;padding:2px}
.pk{cursor:pointer;font-size:12px;padding:5px 9px;border-radius:8px;background:var(--s1);border:1px solid var(--line);color:var(--mut);display:inline-flex;align-items:center;gap:6px;user-select:none}
.pk i{width:7px;height:7px;border-radius:50%;display:inline-block}
.pk.on{color:var(--txt);border-color:var(--gold);background:rgba(110,150,255,.14)}
.pgrp{font-size:11px;font-weight:900;margin:10px 0 6px}
.tgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tc{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px;transition:border-color .15s}
.tc.drop{border-color:var(--gold);background:rgba(110,150,255,.10)}
.tc.full{opacity:.92}
.tch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:900}
.tch span{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.mem{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;background:var(--s2);border:1px solid var(--line);margin-bottom:5px;font-size:12px;cursor:grab;user-select:none}
.mem.sel{outline:2px solid var(--gold);outline-offset:1px}
.mem i{width:7px;height:7px;border-radius:50%;flex:none}
.mem b{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem em{font-style:normal;color:var(--mut);font-size:10.5px;font-variant-numeric:tabular-nums}
.mem .xx{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:0 2px}
.slot{height:31px;border:1px dashed var(--line2);border-radius:8px;margin-bottom:5px}
.pool{background:var(--s2);border:1px dashed var(--line2);border-radius:12px;padding:10px;min-height:52px;display:flex;flex-wrap:wrap;gap:6px}
.pool .mem{margin:0}
.bal{font-size:12px;color:var(--mut)}
.bal b{color:var(--txt)}
.tbfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tbfoot .sp{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:12px;color:var(--txt)}
.paste{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.paste textarea{width:100%;min-height:92px;resize:vertical;background:transparent;border:0;outline:none;color:var(--txt);font:inherit;font-size:12.5px;line-height:1.6}
.paste .pbtn{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.paste .pbtn .sp{flex:1}
.pres{font-size:12px;color:var(--mut);margin:-4px 0 12px;line-height:1.7}
.pres b{color:var(--green)}
.pres .miss{color:#ff8a8e}
.pres .un{display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0;padding:2px 8px;border-radius:999px;border:1px dashed rgba(255,138,142,.5);color:#ffb3b5;cursor:pointer;font-size:11.5px}
.pres .un:hover{background:rgba(255,138,142,.1)}
.selbox{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.sgrp{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.sgrp.f{border-top:0;padding-top:0}
.sgt{min-width:92px;font-size:12px;font-weight:900;padding-top:4px}
.sgt em{display:block;font-style:normal;font-weight:500;color:var(--mut);font-size:10.5px;margin-top:2px}
.sgl{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.sch{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:4px 3px 4px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.sch .xx{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:0 4px}
.sch .xx:hover{color:#ff8a8e}
.sch[draggable]{cursor:grab;user-select:none}
.sch.sel{outline:2px solid var(--gold);outline-offset:1px}
.tlay{display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;align-items:start}
.tpool{position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto;background:var(--s2);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;min-height:120px;transition:border-color .15s}
.tpool.drop{border-color:var(--gold);background:rgba(110,150,255,.08)}
.tpt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
.tpt b{color:var(--txt)}
.tpt span{margin-left:auto;font-size:10.5px;color:var(--dim)}
.sgrp2{padding:8px 0;border-top:1px solid var(--line)}
.sgrp2:first-of-type{border-top:0}
.sgt2{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:900;margin-bottom:6px}
.sgt2 em{font-style:normal;font-weight:500;color:var(--mut);font-size:10.5px}
/* team draft */
.draft .holo,.dteam .holo{height:3px;background:linear-gradient(100deg,#7aa2ff,#a88bff,#f59bd0,#7bdff2,#7aa2ff);background-size:300% 100%;animation:holo 18s linear infinite}
@keyframes holo{to{background-position:300% 0}}
.dtool{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dtool .sp{flex:1}
.dstat{display:flex;gap:6px;flex-wrap:wrap}
.dstat span{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--s1);border:1px solid var(--line);color:var(--mut)}
.dstat .a{color:var(--green);border-color:rgba(76,195,138,.35)}
.dstat .b{color:#ffb3b5;border-color:rgba(255,138,142,.35)}
.btn.holo2{background:linear-gradient(100deg,rgba(122,162,255,.22),rgba(168,139,255,.22),rgba(245,155,208,.18));border-color:rgba(140,160,255,.45)}
.memo{width:100%;min-height:110px;background:var(--s2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font:inherit;font-size:13px;resize:vertical;outline:none}
.dteams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.dteam{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s}
.dteam.drop{border-color:var(--gold)}
.dti{padding:11px}
.dti h4{margin:0 0 9px;display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:900}
.dti h4 em{font-style:normal;color:var(--gold);font-size:12.5px;font-variant-numeric:tabular-nums}
.dslot{position:relative;display:flex;align-items:center;gap:7px;min-height:36px;border-radius:9px;margin-bottom:6px;font-size:12.5px;transition:border-color .15s,background .15s}
.dslot.drop{outline:2px dashed var(--gold);outline-offset:1px}
.dslot.fill{padding:7px 9px;background:var(--s2);border:1px solid var(--line);cursor:grab;user-select:none}
.dslot.fill.cap{border-color:rgba(246,197,96,.5);background:linear-gradient(90deg,rgba(246,197,96,.12),var(--s2) 70%)}
.dslot.sel{outline:2px solid var(--gold);outline-offset:1px}
.dslot i{width:7px;height:7px;border-radius:50%;flex:none}
.dslot b{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dslot em{font-style:normal;color:var(--mut);font-size:10.5px;font-variant-numeric:tabular-nums}
.dslot .star{color:#f6c560;font-size:12px}
.dslot .xx{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:0 2px}
.dslot.emp{border:1px dashed var(--line2)}
.dslot.emp.cap{border-color:rgba(246,197,96,.45)}
.slotin{width:100%;background:transparent;border:0;outline:none;color:var(--txt);padding:8px 10px;font:inherit;font-size:12.5px}
.slotin::placeholder{color:var(--dim)}
.dac{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:4px;background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);max-height:260px;overflow:auto;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dac div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-size:12.5px;cursor:pointer}
.dac div.on,.dac div:hover{background:var(--hov)}
.dac span{display:flex;align-items:center;gap:7px}
.dac i{width:7px;height:7px;border-radius:50%}
.dac small{color:var(--dim);font-size:10.5px}
.dac b{color:var(--mut);font-size:11px;font-weight:700}
.entry{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:8px;border:1px dashed var(--line2);border-radius:12px;background:var(--s2)}
.echip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);cursor:grab;animation:pop .18s ease-out}
.echip i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;background:var(--c);color:#0b0d14}
.dlines{background:var(--s2);border:1px dashed var(--line2);border-radius:12px;padding:4px 12px}
.dlines.drop{border-color:var(--gold)}
.pline2{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.pline2:first-child{border-top:0}
.lsc{width:92px;flex:none;font-weight:900;font-size:15px;line-height:1.2}
.lsc i{display:block;font-style:normal;font-weight:600;color:var(--mut);font-size:10.5px;margin-top:2px}
.lnm{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.draft.cap .hc{display:none!important}
.sch.taken{opacity:.3;text-decoration:line-through;cursor:default;padding-right:9px;filter:grayscale(.6)}
.dr .sch:not(.taken){cursor:pointer}
.dslot.emp.turn{border:2px solid var(--gold);background:rgba(246,197,96,.1);box-shadow:0 0 0 3px rgba(246,197,96,.18);animation:tpulse 1.6s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 6px rgba(246,197,96,.06)}}
.dturn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:linear-gradient(100deg,rgba(246,197,96,.14),rgba(122,162,255,.08));border:1px solid rgba(246,197,96,.35);font-size:13px}
.dturn b{color:var(--gold);font-size:15px;margin-left:4px}
.dturn small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.dturn .btn{flex:none;padding:6px 12px;font-size:12px}
.dturn .btn:disabled{opacity:.4;cursor:default}
.dteam{overflow:visible;position:relative}
.dteam>.holo{border-radius:14px 14px 0 0}
.dteam:focus-within{z-index:5}
.sch.capc{border-color:#f6c560;box-shadow:0 0 0 1px rgba(246,197,96,.6) inset}
.lsc{width:110px}
body.vteam .wrap{grid-template-columns:200px minmax(0,1fr)}
body.vteam .rank{display:none}
.dlay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.dl{min-width:0}
.dl .dteams{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.dl .tbfoot{margin-top:10px}
.dr{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.drb{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px}
.drb h3{margin:0 0 8px;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}
.drb .cntb{font-size:12px;color:var(--gold)}
.drhint{font-size:11px;color:var(--mut);margin:-2px 0 8px}
.dr .dlines{padding:2px 10px}
.dr .pline2{display:block;padding:8px 0}
.dr .lsc{width:auto;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.dr .lsc i{display:inline;margin:0}
.dr .entry{min-height:44px}
/* tier chip */
.tchip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);white-space:nowrap}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:48px 16px;overflow-y:auto}
.ov.on{display:flex}
.md{width:100%;max-width:560px;overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mdh{padding:20px 20px 16px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.mdh h3{margin:0 0 7px;font-size:20px;font-weight:900}
.x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;line-height:1}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px}
.ms div{background:var(--s1);border-radius:10px;padding:11px 6px;text-align:center}
.ms span{display:block;color:var(--mut);font-size:10.5px}
.ms b{display:block;font-size:17px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.mchips{padding:0 16px 12px}
.mh{max-height:44vh;overflow-y:auto;padding:0 12px 14px}
.hi{display:grid;grid-template-columns:24px 1fr auto auto auto;gap:10px;align-items:center;padding:9px 8px;border-top:1px solid var(--line);font-size:12.5px}
.hw.open .hi{background:var(--s1)}
.hd{display:none;padding:6px 4px 12px}
.hw.open .hd{display:block}
.hi{cursor:pointer}
.hi .hmore{font-size:10.5px;color:var(--mut);white-space:nowrap}
.hw.open .hmore{color:var(--gold)}
.gnote{font-size:11px;color:var(--mut);margin:2px 0 8px}
.gp.me,.gtr.me{outline:1.5px solid var(--gold);outline-offset:-1.5px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.gcard{background:#fff;color:#1f2937;border:2px solid #60799a;border-radius:10px;overflow:hidden;font-size:12.5px}
.gcard.mine{box-shadow:0 0 0 3px var(--gold)}
.gch{background:#94b9e6;color:#1d2f45;font-weight:900;font-size:13.5px;text-align:center;padding:7px 6px;border-bottom:1px solid #60799a}
.gch i{display:block;font-style:normal;font-weight:600;font-size:10.5px;opacity:.7;margin-top:1px}
.gcr{text-align:center;padding:5px 6px;border-top:1px dashed #c7d6ea;cursor:pointer;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcr:first-of-type{border-top:0}
.gcr b{font-weight:900}.gcr small{color:#6b7280;font-weight:600;font-size:10.5px}
.gcr.e{cursor:default}
.gcr.me{background:#fff6d6}
.gcf{background:#e1ebf8;color:#3a4f6a;text-align:center;padding:5px 6px;font-size:11.5px;font-weight:700;border-top:1px solid #c7d6ea}
.gcard.g1{border-color:#c9a227}.gcard.g1 .gch{background:#f5c542;color:#4a3b00;border-color:#c9a227}.gcard.g1 .gcf{background:#fdf1c7;color:#6b5400}
.gcard.g2{border-color:#8d97a5}.gcard.g2 .gch{background:#c3cad4;color:#2f3742;border-color:#8d97a5}.gcard.g2 .gcf{background:#eceff3;color:#4b5563}
.gcard.g3{border-color:#b0723f}.gcard.g3 .gch{background:#d99a63;color:#4a2a10;border-color:#b0723f}.gcard.g3 .gcf{background:#f5e1cf;color:#6b3d1a}
.gdt{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.gtm{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gtm.win{border-color:rgba(246,197,96,.55);box-shadow:0 0 0 1px rgba(246,197,96,.2) inset}
.gtm.mine{border-color:var(--gold)}
.gth{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--s2);font-size:12.5px;font-weight:900}
.gtm.win .gth{background:linear-gradient(90deg,rgba(246,197,96,.22),var(--s2))}
.gth i{font-style:normal;font-weight:600;color:var(--mut);font-size:11px;margin-left:4px}
.gth b{color:var(--gold)}
.gtr{display:grid;grid-template-columns:minmax(0,1fr) 34px 52px 38px;gap:4px;align-items:center;padding:5px 10px;font-size:12px;border-top:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.gtr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.gtr span,.gtr b{text-align:right}.gtr span:first-child{text-align:left}
.gtr small{color:#ff8a8e;font-size:10px;margin-left:2px}
.gtl{font-size:10.5px;color:var(--mut);cursor:default}.gtl span{font-weight:600!important}
.gtf{display:flex;flex-wrap:wrap;gap:4px 10px;padding:7px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.gtf b{color:var(--txt)}
.hi .r{width:22px;height:20px;border-radius:5px;font-size:10px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center}
.hi .r.W{background:#3f6fe0}.hi .r.L{background:#c9434a}
.hi b{font-variant-numeric:tabular-nums}
.load,.empty{padding:50px 20px;text-align:center;color:var(--mut)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{grid-column:1/-1;text-align:center;color:var(--dim);font-size:11px;padding:8px 0 4px}
@media (max-width:1180px){.wrap{grid-template-columns:200px minmax(0,1fr)}.rank{position:static;grid-column:2}}

 .rank{grid-column:1}

}
/* ===== NEO (cobalt) ===== */
body{font-family:'Pretendard','Noto Sans KR',sans-serif;letter-spacing:-.012em}
/* compact hero */
.head{padding:18px 24px;gap:18px}
.hlogo{width:68px;height:68px}
.head h1{font-size:24px;margin:2px 0}
.head p,.eyebrow{display:none}.han{font-size:11px;letter-spacing:.3em;color:var(--gold2)}
/* tier selector */
.st3 .lbl{margin-bottom:9px}
.tnav{gap:6px}
.tnav a{position:relative;padding:11px 12px 11px 16px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--txt);overflow:hidden;transition:all .15s}
.tnav a:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.tnav a i{display:none}
.tnav a span{font-weight:700;color:var(--mut);background:var(--s1);border-radius:999px;padding:2px 8px;font-size:10.5px}
.tnav a:hover{border-color:var(--line2);background:var(--hov)}
.tnav a.on{border-color:var(--tc);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 22%,transparent),color-mix(in srgb,var(--tc) 4%,transparent));box-shadow:0 0 0 1px color-mix(in srgb,var(--tc) 40%,transparent),0 6px 18px color-mix(in srgb,var(--tc) 18%,transparent)}
.tnav a.on b{color:var(--tc)}
.tnav a.on span{background:var(--tc);color:#08101f}
/* tier panel */
.tsel{overflow:visible}
.tsh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 22px 4px}
.tsh h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.03em;color:var(--tc);display:flex;align-items:center;gap:10px}
.tsh h2 small{font-size:11px;font-weight:700;color:var(--mut);padding:4px 9px;border-radius:8px;background:var(--s1);border:1px solid var(--line);letter-spacing:0}
.tsh .tsub{color:var(--mut);font-size:12px;margin-top:6px}
.tsh .tstat{display:flex;gap:18px}
.tsh .tstat div{text-align:right}.tsh .tstat span{display:block;font-size:10.5px;color:var(--dim)}.tsh .tstat b{font-size:17px;font-variant-numeric:tabular-nums}
.tgh{display:flex;align-items:center;gap:10px;padding:16px 22px 0;font-size:15px;font-weight:900;color:var(--tc)}
.tgh:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 45%,transparent),transparent)}
.tgh span{order:2;font-size:11px;font-weight:700;color:var(--mut);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tgh+.pgrid{padding-top:12px}
.tnav a.all{--tc:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 18px 20px}
.pc{position:relative;background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 9%,var(--s1)),var(--s2) 70%);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;cursor:pointer;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.pc:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--tc),transparent)}
.pc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--tc) 55%,var(--line2));box-shadow:0 14px 32px rgba(10,40,120,.28)}
.pc.no{opacity:.55}
.pc .ph{display:flex;align-items:center;gap:11px}
.pc .av{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--s2));border:1px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.pc .pn{min-width:0;flex:1}
.pc .pn b{display:block;font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pn span{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.pc .pn span em{font-style:normal;color:var(--gold2);font-weight:700}
:root[data-theme="light"] .pc .pn span em{color:var(--gold)}
.pc .rkb{align-self:flex-start;font-size:11px;font-weight:900;color:var(--mut);background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-variant-numeric:tabular-nums}

 <div class="foot">희낙.GG · 희희낙락 킬내기 · 기록은 티어표 시트와 자동 동기화돼요 · <span id="sAt"></span></div>
</div>

<script>
var API='https://script.google.com/macros/s/AKfycbyHfQC9_hT0G_H6OTzXVVCelz2K875S161yXT2gbxy-DNxpmWdnzkRycx8ZF8Bikkke/exec';
var CURD=null,SEAS='';
var D=null,M={},MODE='all',VIEW='tier',RK='kd',Q='',RULE='전체',GLIM=25,CHIPN=15,MINR=3,RV='kd',RMIN=1;
var TIERS=['갓티어','1티어 상','1티어 하','2티어 상','2티어 하','3티어','4티어','BABY티어','미배정'];
var TC={'갓티어':'#ff5a76','1티어 상':'#ff9f43','1티어 하':'#f6c560','2티어 상':'#2ed3b7','2티어 하':'#62c6ee','3티어':'#9b8cff','4티어':'#a3adbf','BABY티어':'#f59bd0','미배정':'#6b7280'};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tierOf(t){t=String(t||'').trim();if(!t)return '미배정';if(TC[t])return t;for(var i=0;i<TIERS.length;i++)if(t.replace(/\s/g,'')==TIERS[i].replace(/\s/g,''))return TIERS[i];return t}
function tc(t){return TC[t]||'#8b8f98'}
function tchip(t){t=tierOf(t);return '<span class="tchip" style="--c:'+tc(t)+'">'+esc(t)+'</span>'}
function f2(x){return (Math.round(x*100)/100).toFixed(2)}
function pct(x){return (Math.round(x*1000)/10).toFixed(1)+'%'}
function gDate(g){var m=String(g.l).match(/^(\S+)\s+(\S+)/);return m?[m[1],m[2]]:[g.l,'']}
function ruleCls(r){r=r||'';return r.indexOf('대꼴')>=0?'dk':r.indexOf('지옥')>=0?'hell':r.indexOf('포인트')>=0?'pt':r.indexOf('연도')>=0?'yd':''}

// ---------- data ----------
var JN=0;
function api(k,ok){var done=false,cb='__hh'+(++JN),sc=document.createElement('script');var t=setTimeout(function(){fin(null)},25000);
 function fin(d){if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(_){window[cb]=undefined}if(sc.parentNode)sc.parentNode.removeChild(sc);ok(d&&!d.error?d:null)}
 window[cb]=function(d){fin(d)};sc.onerror=function(){fin(null)};sc.src=API+'?v=api&k='+k+'&callback='+cb+'&_='+Date.now();document.head.appendChild(sc)}
function mLabel(m){if(m=='all')return '통합';var q=String(m).split(':');return (q[0]=='d'?'킬딜내기 ':'킬내기 ')+(q[1]||'')}
function build(games,tiers,only){
 games=games.slice().sort(function(a,b){return b.t-a.t});var P={};
 games.forEach(function(g){var dm=null;if(/킬딜/.test(g.l)&&g.d){dm={};g.d.forEach(function(t){t.m.forEach(function(m){dm[m[0]]=Number(m[4])||0})})}g.p.forEach(function(x){var n=x[0];var p=P[n]||(P[n]={n:n,g:0,w:0,k:0,h:[],dg:0,dl:0});p.g++;p.w+=x[2];p.k+=x[1];if(dm&&dm[n]!=null){p.dg++;p.dl+=dm[n]}p.h.push({g:g,k:x[1],w:x[2]})})});
 var names=Object.keys(tiers);Object.keys(P).forEach(function(n){if(names.indexOf(n)<0)names.push(n)});
 var list=names.map(function(n){var p=P[n]||{n:n,g:0,w:0,k:0,h:[],dg:0,dl:0};p.ad=p.dg?p.dl/p.dg:0;p.l=p.g-p.w;p.wr=p.g?p.w/p.g:0;p.kd=p.g?p.k/p.g:0;p.t=tierOf(tiers[n]?tiers[n][0]:'');p.pen=tiers[n]?tiers[n][1]:'';p.best=p.h.length?Math.max.apply(null,p.h.map(function(h){return h.k})):0;P[n]=p;return p});
 var rec=list.filter(function(p){return p.g});if(only)list=rec;
 ['wr','kd','k'].forEach(function(k){var l=rec.slice().sort(function(a,b){return (b[k]-a[k])||(b.g-a.g)});l.forEach(function(p,i){p['r_'+k]=i+1})});
 return {games:games,P:P,list:list,rec:rec};
}
function prep(){
 var t=D.base.t,seen={},all=D.base.g.concat((D.dk&&D.dk.g)||[]).filter(function(g){if(seen[g.id])return false;seen[g.id]=1;return true});
 M.all=build(all,t);M.base=M.all;
 ['연도룰','대꼴룰','지옥룰'].forEach(function(r){M['k:'+r]=build(all.filter(function(g){return !/킬딜/.test(g.l)&&g.r==r}),t,1);M['d:'+r]=build(all.filter(function(g){return /킬딜/.test(g.l)&&g.r==r}),t,1)});
 if(!M[MODE])MODE='all';
}

// ---------- side & rank ----------
function rSide(){
 var m=M[MODE];$('sSeason').textContent=D.season||'-';$('sMem').textContent=m.list.length+'명';$('sGames').textContent=m.games.length+'경기';
 $('sLast').textContent=m.games[0]?gDate(m.games[0]).join(' '):'-';$('sAt').textContent=(D.at||'')+' 기준';
 $('modeTag').textContent=mLabel(MODE);
 var cnt={};m.list.forEach(function(p){cnt[p.t]=(cnt[p.t]||0)+1});var ts=order(cnt);if(TSEL!='__all'&&!cnt[TSEL])TSEL='__all';
 $('tnav').innerHTML='<a href="#" class="all'+(VIEW=='tier'&&!Q&&TSEL=='__all'?' on':'')+'" data-go="__all"><b>전체 보기</b><span>'+m.list.length+'</span></a>'+ts.map(function(t){return '<a href="#" class="'+(VIEW=='tier'&&!Q&&t==TSEL?'on':'')+'" style="--tc:'+tc(t)+'" data-go="'+esc(t)+'"><b>'+esc(t)+'</b><span>'+cnt[t]+'</span></a>'}).join('');
}
function order(cnt){return TIERS.filter(function(t){return cnt[t]}).concat(Object.keys(cnt).filter(function(t){return TIERS.indexOf(t)<0}))}
function rRank(){
 var m=M[MODE];var l=m.rec.filter(function(p){return p.g>=MINR}).sort(function(a,b){return (b[RK]-a[RK])||(b.g-a.g)}).slice(0,10);
 $('rTitle').textContent={wr:'최고 승률 TOP 10',kd:'평균 KD TOP 10',k:'누적 킬 TOP 10'}[RK];
 if(!l.length){$('rankList').innerHTML='<div class="empty" style="padding:24px 0">기록이 부족해요</div>';return}
 $('rankList').innerHTML=l.map(function(p,i){var v=RK=='wr'?pct(p.wr):RK=='kd'?f2(p.kd):p.k+'킬';var s=RK=='wr'?p.w+'승 '+p.l+'패':p.g+'판';
  return '<div class="ri" data-p="'+esc(p.n)+'"><div class="n">'+(i+1)+'</div><div><b>'+esc(p.n)+'</b><div class="s">'+esc(p.t)+'</div></div><div class="p">'+v+'<span>'+s+'</span></div></div>'}).join('');
}

// ---------- tier board ----------
function chips(p,n){var h=p.h.slice(0,n),o='';h.forEach(function(x){var d=gDate(x.g);o+='<span class="chip '+(x.w?'W':'L')+'" data-t="'+esc(d[0]+' '+d[1]+' · '+(x.g.r||'')+' · '+x.k+'킬')+'">'+(x.w?'W':'L')+'</span>'});return o}
var TSEL='__all';
function pCard(p,i,showT){var c=tc(p.t),init=esc(Array.from(p.n)[0]||'?');
 var rec=p.h.slice(0,12).map(function(x){var d=gDate(x.g);return '<i class="'+(x.w?'w':'l')+'" data-t="'+esc(d[0]+' '+d[1]+' · '+(x.g.r||'')+' · '+x.k+'킬'+(x.w?' · 승':''))+'"></i>'}).join('');
 return '<div class="pc'+(p.g?'':' no')+'" data-p="'+esc(p.n)+'" style="--tc:'+c+'"><div class="ph"><div class="av">'+init+'</div><div class="pn"><b>'+esc(p.n)+'</b><span>'+(showT?esc(p.t)+' · ':'')+(p.g?'승률 <em>'+p.r_wr+'위</em> · KD <em>'+p.r_kd+'위</em>':'기록 없음')+'</span></div>'+(showT?'':'<div class="rkb'+(i==0&&p.g?' t1':'')+'">#'+(i+1)+'</div>')+'</div>'+
  (p.g?'<div class="ps"><div class="hl"><span>평균 KD</span><b>'+f2(p.kd)+'</b></div><div><span>승률</span><b>'+pct(p.wr)+'</b></div><div><span>누적 킬</span><b>'+p.k+'</b></div><div><span>참여</span><b>'+p.g+'</b></div></div>'+(p.dg?'<div class="pdl">💥 평균 딜 <b>'+Math.round(p.ad).toLocaleString()+'</b><span>킬딜 '+p.dg+'판</span></div>':'')+'<div class="wrbar"><b style="width:'+Math.max(2,Math.round(p.wr*100))+'%"></b></div><div class="rec">'+rec+'</div><div class="pf"><span><b>'+p.g+'</b>전 '+p.w+'승 '+p.l+'패</span><span>최고 <b>'+p.best+'</b>킬</span></div>':'<div class="pe">아직 참여한 경기가 없어요</div>')+'</div>'}
function rTier(){
 var m=M[MODE];var groups={};m.list.forEach(function(p){(groups[p.t]=groups[p.t]||[]).push(p)});
 var cnt={};Object.keys(groups).forEach(function(t){cnt[t]=groups[t].length});var ts=order(cnt);
 if(!ts.length){$('board').innerHTML='<div class="card empty">기록이 없어요</div>';return}
 if(TSEL!='__all'&&!cnt[TSEL])TSEL='__all';
 var srt=function(a,b){return (b.g?1:0)-(a.g?1:0)||b.kd-a.kd||b.wr-a.wr||a.n.localeCompare(b.n)};
 var ps,h;
 if(Q){ps=m.list.filter(function(p){return p.n.toLowerCase().indexOf(Q)>=0}).sort(srt);
  h='<div class="tsh" style="--tc:var(--gold)"><div><h2>검색 결과</h2><div class="tsub">“'+esc(Q)+'” · '+ps.length+'명</div></div></div>';}
 else if(TSEL=='__all'){var all=m.list.filter(function(p){return p.g}),g=all.reduce(function(s,p){return s+p.g},0),k=all.reduce(function(s,p){return s+p.k},0);
  h='<div class="tsh" style="--tc:var(--gold)"><div><h2>전체 보기</h2><div class="tsub">'+m.list.length+'명 · 기록 있는 멤버 '+all.length+'명</div></div><div class="tstat"><div><span>전체 평균 KD</span><b>'+(g?f2(k/g):'-')+'</b></div><div><span>전체 경기</span><b>'+m.games.length+'</b></div></div></div>';
  $('board').innerHTML='<section class="card tier tsel">'+h+ts.map(function(t){var tp=groups[t].slice().sort(srt),pn=tp[0].pen;return '<div class="tgh" style="--tc:'+tc(t)+'">'+esc(t)+(pn!==''&&pn!=null&&String(pn)!='0'?' <small style="font-size:11px;color:var(--mut);font-weight:700">핸디 '+(Number(pn)>0?'+':'')+esc(pn)+'</small>':'')+'<span>'+tp.length+'명</span></div><div class="pgrid">'+tp.map(function(p,i){return pCard(p,i,false)}).join('')+'</div>'}).join('')+'</section>';return}
 else{ps=groups[TSEL].slice().sort(srt);var rp=ps.filter(function(p){return p.g}),pen=ps[0].pen;
  var g=rp.reduce(function(s,p){return s+p.g},0),w=rp.reduce(function(s,p){return s+p.w},0),k=rp.reduce(function(s,p){return s+p.k},0);
  h='<div class="tsh" style="--tc:'+tc(TSEL)+'"><div><h2>'+esc(TSEL)+(pen!==''&&pen!=null&&String(pen)!='0'?'<small>핸디 '+(Number(pen)>0?'+':'')+esc(pen)+'</small>':'')+'</h2><div class="tsub">'+ps.length+'명 · 기록 있는 멤버 '+rp.length+'명</div></div>'+
   '<div class="tstat"><div><span>티어 평균 KD</span><b>'+(g?f2(k/g):'-')+'</b></div><div><span>티어 승률</span><b>'+(g?pct(w/g):'-')+'</b></div><div><span>총 참여</span><b>'+g+'</b></div></div></div>';}
 $('board').innerHTML='<section class="card tier tsel">'+h+(ps.length?'<div class="pgrid">'+ps.map(function(p,i){return pCard(p,i,!!Q)}).join('')+'</div>':'<div class="empty">검색 결과가 없어요</div>')+'</section>';
}

async function shufEntry(){var rest=unassigned();if(!rest.length){alert('남아 있는 선수가 없어요');return}shuffle(rest);TB.entry=[];rEntry();for(var i=0;i<rest.length;i++){TB.entry.push(rest[i]);rEntry();await sleepMs(140)}tbSave()}
function teamClick(e){var t,n;
 if(t=e.target.closest('[data-acp]')){var inp=t.closest('.dslot').querySelector('.slotin');slotPick(inp,t.dataset.acp);return true}
 if(e.target.closest('.slotin'))return true;
 acClose();
 if(e.target.id=='tClr'){if(!TB.sel.length||confirm('명단과 팀 배치를 모두 지울까요?')){TB.sel=[];TB.teams=[];TB.n=0;TB.pres=null;TB.entry=[];TB.ptxt=''}rTeam();return true}
 if(e.target.id=='tAddBtn'){addName($('tAdd').value);rTeam();setTimeout(function(){var a=$('tAdd');if(a)a.focus()},0);return true}
 if(e.target.id=='dIn'){TB.showIn=!TB.showIn;rTeam();return true}
 if(e.target.id=='dMemo'){TB.showMemo=!TB.showMemo;rTeam();return true}
 if(e.target.id=='dCap'){TB.cap=!TB.cap;rTeam();return true}
 if(e.target.id=='dCopy'){var txt=TB.teams.map(function(x,i){return (i+1)+'팀 '+(x[0]||'')}).join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){e.target.textContent='✓ 복사됨';setTimeout(function(){var b=$('dCopy');if(b)b.textContent='⧉ 팀장 복사'},1200)}).catch(function(){prompt('아래 내용을 복사하세요',txt)});return true}
 if(e.target.id=='dUndo'){dUndo();return true}
 if(e.target.id=='dCapMode'){TB.capMode=!TB.capMode;rTeam();return true}
 if(e.target.id=='dCapRand'){capRand();return true}
 if(e.target.id=='dReroll'){if(confirm('모든 라인을 비울까요?')){TB.teams=TB.teams.map(function(){return []});rTeam()}return true}
 if(e.target.id=='dShufCap'){shufCap();return true}
 if(e.target.id=='dShufEntry'){shufEntry();return true}
 if(t=e.target.closest('[data-ts]')){TB.size=+t.dataset.ts;TB.n=0;TB.teams.forEach(function(x){x.splice(TB.size)});rTeam();return true}
 if(t=e.target.closest('[data-mk]')){makeTeams(t.dataset.mk);return true}
 if(e.target.id=='tLoad'){loadBoardTeams('apply');return true}
 if(e.target.id=='tApply'){applyTeams();return true}
 if(e.target.id=='tPasteAdd'){doPaste(false);return true}
 if(e.target.id=='tPasteSet'){doPaste(true);return true}
 if(t=e.target.closest('[data-addun]')){n=t.dataset.addun;if(TB.sel.indexOf(n)<0)TB.sel.push(n);TB.pres.miss=TB.pres.miss.filter(function(x){return x!==n});TB.pres.found.push(n);rTeam();return true}
 if(t=e.target.closest('[data-del]')){n=t.dataset.del;moveOut(n);var k=TB.sel.indexOf(n);if(k>=0)TB.sel.splice(k,1);rTeam();return true}
 if(TB.capMode&&(t=e.target.closest('.dlines [data-mv]'))){n=t.dataset.mv;var ci=TB.capSel.indexOf(n);if(ci>=0)TB.capSel.splice(ci,1);else TB.capSel.push(n);rTeam();return true}
 if(!TB.pick&&(t=e.target.closest('.dlines [data-mv]'))){turnPick(t.dataset.mv);return true}
 if(t=e.target.closest('[data-back]')){moveTo(t.dataset.back,'pool');return true}
 if(t=e.target.closest('[data-mv]')){n=t.dataset.mv;if(TB.pick&&TB.pick.n!=n){var dz=t.closest('[data-drop]');if(dz&&String(dz.dataset.drop)!==String(TB.pick.from)){moveTo(TB.pick.n,dz.dataset.drop);return true}}TB.pick=TB.pick&&TB.pick.n==n?null:{n:n,from:t.dataset.from};rTeam();return true}
 if(TB.pick&&(t=e.target.closest('[data-drop]'))){moveTo(TB.pick.n,t.dataset.drop);return true}
 return false}
document.addEventListener('input',function(e){if(e.target.classList&&e.target.classList.contains('slotin'))acOpen(e.target);if(e.target.id=='dMemoTxt'){TB.memo=e.target.value;tbSave()}});
document.addEventListener('focusin',function(e){if(e.target.classList&&e.target.classList.contains('slotin')){var k=seqIdx(e.target.dataset.slot);if(k>=0&&k!==curTurn()){TB.turn=k;turnUI()}acOpen(e.target)}});
document.addEventListener('keydown',function(e){if(!(e.target.classList&&e.target.classList.contains('slotin')))return;var ac=document.querySelector('.dac'),items=ac?[].slice.call(ac.children):[],ix=items.findIndex(function(x){return x.classList.contains('on')});
 if(e.key=='ArrowDown'&&items.length){e.preventDefault();ix=Math.min(ix+1,items.length-1);items.forEach(function(x,i){x.classList.toggle('on',i==ix)})}
 else if(e.key=='ArrowUp'&&items.length){e.preventDefault();ix=Math.max(ix-1,0);items.forEach(function(x,i){x.classList.toggle('on',i==ix)})}
 else if(e.key=='Enter'){e.preventDefault();slotPick(e.target,items.length?items[Math.max(0,ix)].dataset.acp:e.target.value)}
 else if(e.key=='Tab'&&!e.shiftKey){e.preventDefault();var v=e.target.value.trim();if(v){slotPick(e.target,items.length?items[Math.max(0,ix)].dataset.acp:v)}else{acClose();TB.turn=seqIdx(e.target.dataset.slot)+1;turnUI();focusTurn()}}
 else if(e.key=='Escape')acClose()});
function rSeas(){var c=CURD||D,L=(c&&c.seasons)||[];$('sbox').style.display=L.length?'':'none';if(!L.length)return;var it=[{k:'',n:(c.season||'현재')+' (현재)'}].concat(L.slice().reverse().map(function(x){return {k:String(x.i),n:x.n}}));$('sseg').innerHTML=it.map(function(x){return '<button data-se="'+esc(x.k)+'" class="'+(SEAS===x.k?'on':'')+'" title="'+esc(x.n)+'">'+esc(x.n)+'</button>'}).join('')}
function pickSeason(k){if(k===SEAS)return;SEAS=k;GLIM=25;if(k===''){D=CURD;prep();render();return}rSeas();$('board').innerHTML='<div class="card empty">시즌 기록을 불러오는 중…</div>';api('data&s='+encodeURIComponent(k),function(d){if(SEAS!==k)return;if(!d){alert('시즌 기록을 불러오지 못했어요. 잠시 후 다시 눌러 주세요.');SEAS='';D=CURD;prep();render();return}D=d;prep();render()})}
function render(){if(!D)return;rSeas();document.body.classList.toggle('vteam',VIEW=='team');rSide();rRank();syncRV();if(VIEW=='tier')rTier();else if(VIEW=='rank')rFull();else if(VIEW=='team')rTeam();else rGames()}
document.addEventListener('click',function(e){var t;
 if(t=e.target.closest('#sseg [data-se]')){pickSeason(t.dataset.se);return}
 if(t=e.target.closest('#mode [data-m]')){MODE=t.dataset.m;sel('#mode button',t);GLIM=25;render();return}
 if(t=e.target.closest('#vtabs [data-v]')){VIEW=t.dataset.v;sel('#vtabs button',t);GLIM=25;render();return}
 if(t=e.target.closest('#rseg [data-r]')){RK=t.dataset.r;sel('#rseg button',t);rRank();return}
 if(t=e.target.closest('[data-rv]')){goRank(t.dataset.rv);return}
 if(e.target.id=='rAll'){goRank(RK);return}
 if(e.target.id=='loginBtn'){openLogin();return}
 if(e.target.id=='logoutBtn'){post('logout',{},function(){});setMe(null);return}
 if(e.target.id=='pwBtn'){openPw();return}
 if(e.target.id=='acctBtn'){openAccts();return}
 if(e.target.id=='goTeam'){goTeam();return}
 if(t=e.target.closest('[data-amgr]')){post('setMgr',{id:t.dataset.amgr,on:t.dataset.on=='1'},function(r){if(!r.ok)alert(r.msg);loadAccts()});return}
 if(t=e.target.closest('[data-aren]')){openRename(t.dataset.aren);return}
 if(t=e.target.closest('[data-apw]')){openPw(t.dataset.apw);return}
 if(t=e.target.closest('[data-adel]')){if(confirm(t.dataset.adel+' 계정을 삭제할까요?'))post('delAccount',{id:t.dataset.adel},function(r){if(!r.ok)alert(r.msg);loadAccts()});return}
 if(teamClick(e))return;
 if(t=e.target.closest('[data-rule]')){RULE=t.dataset.rule;GLIM=25;rGames();return}
 if(t=e.target.closest('[data-go]')){e.preventDefault();TSEL=t.dataset.go;Q='';if($('q'))$('q').value='';if(VIEW!='tier'){VIEW='tier';sel('#vtabs button',document.querySelector('#vtabs [data-v=tier]'))}render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(e.target.id=='more'){GLIM+=25;rGames();return}
 if(t=e.target.closest('.hi[data-hi]')){var pw=t.parentNode,hd=pw.querySelector('.hd'),pn=$('md').dataset.pn,pp=M[MODE].P[pn];if(pw.classList.toggle('open')&&pp&&!hd.innerHTML)hd.innerHTML=gDetail(pp.h[+t.dataset.hi].g,pn);return}
 if(t=e.target.closest('[data-p]')){openP(t.dataset.p);return}
 if(t=e.target.closest('.gmh')){t.parentNode.classList.toggle('open');return}
 if(e.target.id=='ov')closeP()});
function sel(q,b){document.querySelectorAll(q).forEach(function(x){x.classList.toggle('on',x==b)})}
document.addEventListener('keydown',function(e){if(e.key=='Escape')closeP()});
$('q').addEventListener('input',function(){Q=this.value.trim().toLowerCase();if(VIEW=='tier')rTier();else if(VIEW=='rank')rFull();else rGames()});
document.addEventListener('change',function(e){if(e.target.id=='rmin'){RMIN=+e.target.value;rFull()}if(e.target.id=='tN'){var nv=Math.max(1,Math.min(30,+e.target.value||1));if(nv!==TB.n||nv!==TB.teams.length){TB.n=nv;setTimeout(rTeam,0)}}});
document.addEventListener('input',function(e){if(e.target.id=='tq'){TB.tq=e.target.value.trim().toLowerCase();var pos=e.target.selectionStart;rTeam();var q=$('tq');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('keydown',function(e){if(e.target.id=='tAdd'&&e.key=='Enter'){$('tAddBtn').click()}});
document.addEventListener('dragstart',function(e){var m=e.target.closest&&e.target.closest('[data-mv]');if(m){e.dataTransfer.setData('text/plain',m.dataset.mv);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('drop')}});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('[data-drop]');if(d)d.classList.remove('drop')});
document.addEventListener('drop',function(e){var d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();var n=e.dataTransfer.getData('text/plain');if(n)moveTo(n,d.dataset.drop)}});
checkSession();
function setTheme(l){document.documentElement.setAttribute('data-theme',l?'light':'dark');$('themeBtn').textContent=l?'다크 스타일로 보기':'라이트 스타일로 보기';try{localStorage.setItem('hhTheme',l?'light':'dark')}catch(_){}}
$('themeBtn').onclick=function(){setTheme(document.documentElement.getAttribute('data-theme')!='light')};
try{if(localStorage.getItem('hhTheme')=='light')setTheme(true)}catch(_){}
function load(){api('data',function(d){if(d){CURD=d;if(SEAS!==''){rSeas();return}D=d;prep();render()}else if(!D){$('board').innerHTML='<div class="card empty">기록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>'}})}
load();setInterval(function(){if(!document.hidden&&!$('ov').classList.contains('on'))load()},180000);
</script>
